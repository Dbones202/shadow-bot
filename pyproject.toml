[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-bot"
dynamic = ["version"]
description = "A guild-scoped Discord multipurpose bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "discord.py>=2.5,<3",
  # Battle cards. The prebuilt Linux wheels bundle libjpeg and zlib, so this
  # needs no system packages on the container.
  "Pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
shadow-bot = "shadow_bot.__main__:main"

[tool.setuptools.dynamic]
# VERSION is the single source of truth. Keeping it in a plain file means a
# release bump is one edit, and CI/tooling can read it without parsing TOML.
version = { file = "VERSION" }

[tool.setuptools.package-data]
# Narration text ships with the package so a fresh guild reads well with
# no configuration. Guilds override individual sections in the database.
# The font is bundled rather than taken from the host so cards render
# identically everywhere; a missing system font would otherwise mean a working
# dev box and a blank banner in production. Licence text ships beside it.
shadow_bot = ["data/narration/*.txt", "data/fonts/*.ttf", "data/fonts/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

